<body>
<form action="home.html">
    <label for="Fullname">FullName</label>

    <input type="text" required minlength="5" maxlength="15">

    <br>

    <label for="Email">Email Address</label>
    <input type="email" required>

    <br>

    <label for="Password">Password</label>

    <br>

    <label for="Color">Color</label>

    <br>

    <label for="age">Age</label>
    <input type="age" required minage="13" maxage 60>
    <p>Accept age range from 13 to 60 only</p>

    <br>

    <label for="date of birth">date of birth</label>
    <input type="date of birth" required>

    <br>

    <label for="phone number">phone number</label>

    <br>

    <label for="portfolio website"></label>
    <input type="url">

    <br>

    <label for="profile color"></label>
    <input type="profile color">

    <br>

    <label for="radio"></label>
    <input type="radio"Beginner>Beginner
    <input type="radio"Intermidiate>Intermidiate
    <input type="radio"advanced>advanced

    <br>

    

    <button type="submit">submit</button>
    

 </form>

</html>
